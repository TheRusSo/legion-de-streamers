name: Validar Legión Bot

on:
  pull_request:
    paths:
      - "legion-de-streamers-v1/**"
      - ".github/workflows/legion-bot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Comprobación de Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: legion-de-streamers-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar build de producción
        run: npm run build
